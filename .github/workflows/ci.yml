name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel pytest ruff click rich numpy scikit-learn
          pip install dspy-ai litellm
      - name: Install package
        run: pip install -e . --no-build-isolation --no-deps
      - name: Lint with ruff
        run: ruff check affinity_bot tests
      - name: Run tests
        env:
          # CI never has LLM keys; LLM layer must gracefully fall back to
          # the rule-based path.
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          OPENAI_API_KEY: ""
        run: pytest -q
